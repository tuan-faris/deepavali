/* Royal blue, cyan, white and gold: inspired by our IT kolam. */

/* Layered fire, glowing wick and metallic bowls. */
.lamps{isolation:isolate;overflow:visible}
.diya{isolation:isolate;animation:none!important;background:radial-gradient(ellipse at 50% 0%,#ffdc8566,transparent 58%),linear-gradient(105deg,#071b51 0%,#176c99 24%,#0c284f 48%,#155786 73%,#040c27 100%);border-top:3px solid #ffe6a3;box-shadow:inset 0 3px 4px #ffc86177,inset 0 -7px 10px #0008,0 8px 18px #0006,0 1px 1px #55e7ff}
.diya:before{content:'';animation:none!important;inset:-7px 0 auto;left:0;top:-7px;width:100%;height:12px;border-radius:50%;transform:none;background:radial-gradient(ellipse,#ffb841 0%,#6e3a14 36%,#06142a 73%);border:1px solid #ffd98c;box-shadow:0 -3px 12px #ffac4033;z-index:0}
.diya:nth-child(2):before{inset:-7px 0 auto;left:0;top:-7px;width:100%;height:12px;animation:none}
.diya:after{content:'';inset:11px 14% auto;height:1px;background:linear-gradient(90deg,transparent,#8befff,transparent);box-shadow:0 3px 7px #02d8ff66}
.wick{position:absolute;left:calc(50% - 2px);top:-15px;width:4px;height:15px;background:linear-gradient(#ffecc0,#ff8e24 35%,#201315 65%);border-radius:3px;transform:rotate(7deg);box-shadow:0 -3px 5px #ff8c20;z-index:3}
.flame{position:absolute;left:calc(50% - 12px);bottom:calc(100% + 6px);width:24px;height:52px;border-radius:52% 48% 45% 45% / 80% 80% 25% 25%;background:radial-gradient(ellipse at 50% 88%,#428bff 0%,#73cfff 8%,transparent 24%),radial-gradient(ellipse at 50% 72%,#fffce1 10%,#ffe38a 38%,#ffb424 65%,#ff641400 78%);transform-origin:50% 100%;filter:drop-shadow(0 0 5px #ffcf5b) drop-shadow(0 0 13px #ff9c2444);z-index:2}
.flame:before{content:'';position:absolute;inset:0 1px 9px;background:linear-gradient(0deg,#fff6be,#ffd04c 62%,#ffaf1900);border-radius:70% 30% 45% 45% / 85% 80% 25% 25%;transform:skewX(-5deg);opacity:.6}
.flame i{position:absolute;left:35%;bottom:5%;width:30%;height:43%;border-radius:50% 50% 35% 35%;background:linear-gradient(#fffef4,#fff5a4 70%,#9edaff);filter:blur(.5px)}
.light-halo{position:absolute;left:50%;bottom:45%;width:150px;height:160px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 65%,#ffbc3933,transparent 67%);pointer-events:none;z-index:-1}
.orbit{position:absolute;left:-16%;bottom:-11px;width:132%;height:15px;border-radius:50%;border:1px solid #39ddff66;box-shadow:0 0 9px #17d7ff33;z-index:-1}
.orbit:after{content:'';position:absolute;left:12%;top:1px;width:16%;height:2px;border-radius:50%;background:#b5faff;box-shadow:0 0 8px #36edff}
.diya:nth-child(2) .flame{width:30px;height:65px;left:calc(50% - 15px)}
@media(prefers-reduced-motion:no-preference){
.flame{animation:living-flame .95s ease-in-out infinite alternate}.flame:before{animation:flame-tip .63s ease-in-out infinite alternate}.light-halo{animation:warm-pulse 1.4s ease-in-out infinite alternate}.orbit{animation:orbit-light 3s linear infinite}
.diya:nth-child(2) .flame{animation-delay:-.42s;animation-duration:1.13s}.diya:nth-child(3) .flame{animation-delay:-.71s;animation-duration:.81s}.diya:nth-child(2) .light-halo{animation-delay:-.8s}

@keyframes flame-tip{to{transform:skewX(8deg) scaleX(.88)}}

}

    <p class="wish">May the light we share bring us closer,<br>fill our hearts with joy,<br>and brighten every new beginning.</p>

    <div class="celebration-scene" role="img" aria-label="Two people celebrating Deepavali with sparkling fireworks"><svg viewBox="0 0 130 140" aria-hidden="true" class="celebrant"><g class="person-body"><circle cx="61" cy="45" r="10" fill="#e8b77e"/><path d="M50 40Q51 24 64 32Q76 34 71 45L66 38Z" fill="#10234b"/><path d="M50 61Q61 54 72 61L80 103H43Z" fill="#13cde8" stroke="#b0f9ff" stroke-width="1.5"/><path d="M52 104L49 130M69 104L75 130" stroke="#ecdcbd" stroke-width="7" stroke-linecap="round"/><path d="M50 65L31 89" stroke="#e8b77e" stroke-width="6" stroke-linecap="round"/><g class="sparkler-arm"><path d="M72 65L92 48L99 32" stroke="#e8b77e" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M99 32L105 13" stroke="#e4f7ff" stroke-width="2"/><g class="sparkler-rays" stroke="#ffe27a" stroke-width="2" stroke-linecap="round"><path d="M105 0V6M105 20V27M91 13H97M113 13H121M95 3L100 8M111 19L117 25M95 23L100 18M112 7L117 2"/><circle cx="105" cy="13" r="3" fill="#fff" stroke="none"/></g></g></g><ellipse cx="60" cy="136" rx="30" ry="2" fill="#3be4ff" opacity=".3"/></svg><span class="scene-wish">Together<br><em>we shine.</em></span><svg viewBox="0 0 130 140" aria-hidden="true" class="celebrant"><g class="person-body"><circle cx="61" cy="45" r="10" fill="#e8b77e"/><path d="M50 40Q51 24 64 32Q76 34 71 45L66 38Z" fill="#10234b"/><path d="M50 61Q61 54 72 61L80 103H43Z" fill="#13cde8" stroke="#b0f9ff" stroke-width="1.5"/><path d="M52 104L49 130M69 104L75 130" stroke="#ecdcbd" stroke-width="7" stroke-linecap="round"/><path d="M50 65L31 89" stroke="#e8b77e" stroke-width="6" stroke-linecap="round"/><g class="sparkler-arm"><path d="M72 65L92 48L99 32" stroke="#e8b77e" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M99 32L105 13" stroke="#e4f7ff" stroke-width="2"/><g class="sparkler-rays" stroke="#ffe27a" stroke-width="2" stroke-linecap="round"><path d="M105 0V6M105 20V27M91 13H97M113 13H121M95 3L100 8M111 19L117 25M95 23L100 18M112 7L117 2"/><circle cx="105" cy="13" r="3" fill="#fff" stroke="none"/></g></g></g><ellipse cx="60" cy="136" rx="30" ry="2" fill="#3be4ff" opacity=".3"/></svg></div>
    <button id="celebrate" type="button">✦ &nbsp; Send a little light</button>
    <p class="sender">From<strong>IT DEPARTMENT</strong></p>
    <p class="signature">Wishing you & your loved ones happiness</p>
    <p id="announcement" class="sr-only" role="status"></p>
  </main>
  <script>
    const canvas = document.querySelector('#sparkles');
    const ctx = canvas.getContext('2d');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    let width, height, stars = [], particles = [], frame, previousTime = 0, nextBurst = 0;
    function resize() {
      width = innerWidth; height = innerHeight;
      const ratio = Math.min(devicePixelRatio || 1, 2);
      canvas.width = width * ratio; canvas.height = height * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      stars = Array.from({length: 65}, () => ({x: Math.random()*width, y: Math.random()*height, r: Math.random()*1.3+.3, phase: Math.random()*6.28}));
      if (reduced.matches) draw(0);
    }
    function burst(x,y) {
      if (reduced.matches) return;
      if (particles.length > 220) return;
      for(let i=0;i<45;i++) {
        const angle = Math.random()*Math.PI*2, speed = Math.random()*3.8+1.2;
        particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color:['#ffdb28','#33d9ff','#ffffff'][i%3]});
      }
    }
    function draw(time, step = 0) {
      ctx.clearRect(0,0,width,height);
      for(const star of stars) {
        ctx.globalAlpha = .12 + (Math.sin(time*.0025+star.phase)+1)*.12;
        if (!reduced.matches) {star.y -= step * (.45 + star.r * .35); if(star.y < -3) star.y = height + 3;}
        ctx.fillStyle = '#f6cd85'; ctx.beginPath(); ctx.arc(star.x + Math.sin(time*.001 + star.phase)*5,star.y,star.r,0,Math.PI*2); ctx.fill();
      }
      for(const p of particles) {
        p.x+=p.vx*step; p.y+=p.vy*step; p.vy+=.025*step; p.life-=.012*step;
        if (p.x > width*.14 && p.x < width*.86) continue;
        ctx.globalAlpha=Math.max(0,p.life)*.75; ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fill();
      }
      particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;
    }
    function animate(time) {
      const step = previousTime ? Math.min((time-previousTime)/16.667, 2) : 1;
      previousTime = time;
      if(time > nextBurst){burst(width*(Math.random()<.5 ? .03 : .97),height*(.12+Math.random()*.26));nextBurst=time+1500+Math.random()*1000;}
      draw(time,step);frame=requestAnimationFrame(animate);
    }
    function start() {cancelAnimationFrame(frame);particles=[];previousTime=0;nextBurst=performance.now()+1800;if(document.hidden)return;if(reduced.matches) draw(0);else {burst(width*.03,height*.25);burst(width*.97,height*.3);frame=requestAnimationFrame(animate)}}
    document.querySelector('#celebrate').addEventListener('click',()=>{
      burst(width*.04,height*.28);burst(width*.96,height*.25);
      document.querySelector('#announcement').textContent='Sending you light, love and a very Happy Deepavali!';
      document.querySelector('#celebrate').textContent='✦  Wishing you light & love';
    });
    addEventListener('resize',resize);reduced.addEventListener('change',start);
    document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('motion-paused',document.hidden);if(document.hidden)cancelAnimationFrame(frame);else start()});
    resize();start();
  </script>
</body>
