<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#180c22">
  <meta name="description" content="Wishing you a beautiful Deepavali filled with light, love and happiness.">
  <title>Happy Deepavali ✨</title>
  <style>
    *{box-sizing:border-box}html{min-height:100%;background:#180c22}body{margin:0;color:#f9e6ba;font-family:Georgia,'Times New Roman',serif;min-height:100svh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 75%,#59213966,transparent 58%),radial-gradient(ellipse at top,#34152f,#140c20 72%)}
    canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}main{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:76px 24px 32px;isolation:isolate}main:before{content:'';position:absolute;inset:18px;border:1px solid #c9985045;border-radius:160px 160px 12px 12px;pointer-events:none;z-index:-1}main:after{content:'';position:absolute;inset:27px;border:1px solid #c9985020;border-radius:154px 154px 8px 8px;pointer-events:none;z-index:-1}
    .eyebrow,.signature,button{font-family:Arial,sans-serif}.eyebrow{font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:#d7ae6e;margin:0 0 30px}.ornament{color:#d9a95e;font-size:27px;letter-spacing:16px;padding-left:16px;margin-bottom:20px}h1{font-weight:400;font-size:clamp(64px,10.5vw,144px);line-height:.94;letter-spacing:-.055em;margin:0;text-shadow:0 0 70px #ffc77225}h1 span{display:block;font-style:italic;color:#f5c976;background:linear-gradient(110deg,#bc803d,#ffe4a0 45%,#d59b4c);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;padding:0 12px 15px}.wish{max-width:410px;font-size:clamp(16px,2vw,20px);line-height:1.8;color:#dac6c4;margin:22px auto 0}.rule{width:52px;height:1px;background:#d4a05c;margin:27px auto 0}
    .lamps{height:155px;display:flex;gap:40px;align-items:end;justify-content:center;margin-top:15px}.diya{position:relative;width:94px;height:44px;background:linear-gradient(#eead57,#9f432c 65%,#662737);border-radius:12% 12% 50% 50% / 15% 15% 85% 85%;border-top:5px solid #f7ca7b;box-shadow:0 12px 40px #0005,inset 0 -7px 0 #6e25334d}.diya:before{content:'';position:absolute;width:23px;height:45px;left:calc(50% - 11px);top:-48px;border-radius:80% 10% 65% 35%;background:linear-gradient(135deg,#fff8d4 20%,#ffe285 55%,#fa8d38);transform:rotate(-12deg);box-shadow:0 0 25px #ffc66a,0 0 80px #ffae4355;animation:flicker 2s ease-in-out infinite alternate}.diya:after{content:'✦ · ✦ · ✦';position:absolute;inset:8px 0;color:#f7bf6b;font-size:12px;letter-spacing:2px}.diya:nth-child(2){width:126px;height:55px;margin-bottom:12px}.diya:nth-child(2):before{height:59px;width:29px;top:-62px;left:calc(50% - 14px);animation-delay:-.8s}.diya:nth-child(3):before{animation-delay:-1.4s}
    button{margin-top:38px;color:#f7d89d;border:1px solid #c99d5d77;background:#f5ce810a;border-radius:30px;padding:13px 22px;font-size:12px;letter-spacing:.05em;cursor:pointer;transition:background .2s,transform .2s}button:hover{background:#f5ce811a;transform:translateY(-2px)}button:focus-visible{outline:2px solid #ffe4a0;outline-offset:5px}.signature{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#a68791;margin:32px 0 0}.corner{position:absolute;top:48px;color:#d3a26366;font-size:35px}.corner.left{left:48px}.corner.right{right:48px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    @keyframes flicker{from{transform:rotate(-14deg) scale(.95)}to{transform:rotate(-5deg) scale(1.05)}}@media(max-width:540px){main{padding:76px 32px 35px}.lamps{gap:22px;height:140px}.diya{width:70px;height:34px}.diya:nth-child(2){width:95px;height:44px}.wish{max-width:285px}.eyebrow{font-size:9px;letter-spacing:.26em}.corner{top:45px;font-size:24px}.corner.left{left:40px}.corner.right{right:40px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <canvas id="sparkles" aria-hidden="true"></canvas>
  <main>
    <span class="corner left" aria-hidden="true">✧</span><span class="corner right" aria-hidden="true">✧</span>
    <p class="eyebrow">A celebration of light & love</p>
    <div class="ornament" aria-hidden="true">· ✧ ·</div>
    <h1>Happy<span>Deepavali</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="wish">May every little light bring you joy,<br>every new beginning bring you hope,<br>and your home be filled with love.</p>
    <div class="lamps" aria-hidden="true"><div class="diya"></div><div class="diya"></div><div class="diya"></div></div>
    <button id="celebrate" type="button">✦ &nbsp; Send a little light</button>
    <p class="signature">Wishing you & your loved ones happiness</p>
    <p id="announcement" class="sr-only" role="status"></p>
  </main>
  <script>
    const canvas = document.querySelector('#sparkles');
    const ctx = canvas.getContext('2d');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    let width, height, stars = [], particles = [], frame;
    function resize() {
      width = innerWidth; height = innerHeight;
      const ratio = Math.min(devicePixelRatio || 1, 2);
      canvas.width = width * ratio; canvas.height = height * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      stars = Array.from({length: 65}, () => ({x: Math.random()*width, y: Math.random()*height, r: Math.random()*1.3+.3, phase: Math.random()*6.28}));
      if (reduced.matches) draw(0);
    }
    function burst(x,y) {
      if (reduced.matches) return;
      for(let i=0;i<45;i++) {
        const angle = Math.random()*Math.PI*2, speed = Math.random()*2.7+.8;
        particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color:['#ffd68a','#e99a72','#fff1c1'][i%3]});
      }
    }
    function draw(time) {
      ctx.clearRect(0,0,width,height);
      for(const star of stars) {
        ctx.globalAlpha = .25 + (Math.sin(time*.0008+star.phase)+1)*.23;
        ctx.fillStyle = '#f6cd85'; ctx.beginPath(); ctx.arc(star.x,star.y,star.r,0,Math.PI*2); ctx.fill();
      }
      for(const p of particles) {
        p.x+=p.vx; p.y+=p.vy; p.vy+=.025; p.life-=.012;
        ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fill();
      }
      particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;
    }
    function animate(time) {draw(time);frame=requestAnimationFrame(animate)}
    function start() {cancelAnimationFrame(frame);particles=[];if(reduced.matches) draw(0);else {burst(width*.2,height*.25);burst(width*.8,height*.3);frame=requestAnimationFrame(animate)}}
    document.querySelector('#celebrate').addEventListener('click',()=>{
      burst(width*.18,height*.28);burst(width*.82,height*.25);burst(width*.5,height*.16);
      document.querySelector('#announcement').textContent='Sending you light, love and a very Happy Deepavali!';
      document.querySelector('#celebrate').textContent='✦  Wishing you light & love';
    });
    addEventListener('resize',resize);reduced.addEventListener('change',start);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(frame);else start()});
    resize();start();
  </script>
</body>
</html>
