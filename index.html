<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06115b">
  <meta name="description" content="Happy Deepavali from Westports IT Department. Wishing you light, love and happiness.">
  <title>Happy Deepavali ✨</title>
  <style>
    *{box-sizing:border-box}html{min-height:100%;background:#180c22}body{margin:0;color:#f9e6ba;font-family:Georgia,'Times New Roman',serif;min-height:100svh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 75%,#59213966,transparent 58%),radial-gradient(ellipse at top,#34152f,#140c20 72%)}
    canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}main{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:76px 24px 32px;isolation:isolate}main:before{content:'';position:absolute;inset:18px;border:1px solid #c9985045;border-radius:160px 160px 12px 12px;pointer-events:none;z-index:-1}main:after{content:'';position:absolute;inset:27px;border:1px solid #c9985020;border-radius:154px 154px 8px 8px;pointer-events:none;z-index:-1}
    .eyebrow,.signature,button{font-family:Arial,sans-serif}.eyebrow{font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:#d7ae6e;margin:0 0 30px}.ornament{color:#d9a95e;font-size:27px;letter-spacing:16px;padding-left:16px;margin-bottom:20px}h1{font-weight:400;font-size:clamp(64px,10.5vw,144px);line-height:.94;letter-spacing:-.055em;margin:0;text-shadow:0 0 70px #ffc77225}h1 span{display:block;font-style:italic;color:#f5c976;background:linear-gradient(110deg,#bc803d,#ffe4a0 45%,#d59b4c);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;padding:0 12px 15px}.wish{max-width:410px;font-size:clamp(16px,2vw,20px);line-height:1.8;color:#dac6c4;margin:22px auto 0}.rule{width:52px;height:1px;background:#d4a05c;margin:27px auto 0}
    .lamps{height:155px;display:flex;gap:40px;align-items:end;justify-content:center;margin-top:15px}.diya{position:relative;width:94px;height:44px;background:linear-gradient(#eead57,#9f432c 65%,#662737);border-radius:12% 12% 50% 50% / 15% 15% 85% 85%;border-top:5px solid #f7ca7b;box-shadow:0 12px 40px #0005,inset 0 -7px 0 #6e25334d}.diya:before{content:'';position:absolute;width:23px;height:45px;left:calc(50% - 11px);top:-48px;border-radius:80% 10% 65% 35%;background:linear-gradient(135deg,#fff8d4 20%,#ffe285 55%,#fa8d38);transform:rotate(-12deg);box-shadow:0 0 25px #ffc66a,0 0 80px #ffae4355;animation:flicker .7s ease-in-out infinite alternate}.diya:after{content:'✦ · ✦ · ✦';position:absolute;inset:8px 0;color:#f7bf6b;font-size:12px;letter-spacing:2px}.diya:nth-child(2){width:126px;height:55px;margin-bottom:12px}.diya:nth-child(2):before{height:59px;width:29px;top:-62px;left:calc(50% - 14px);animation-delay:-.8s}.diya:nth-child(3):before{animation-delay:-1.4s}
    button{margin-top:38px;color:#f7d89d;border:1px solid #c99d5d77;background:#f5ce810a;border-radius:30px;padding:13px 22px;font-size:12px;letter-spacing:.05em;cursor:pointer;transition:background .2s,transform .2s}button:hover{background:#f5ce811a;transform:translateY(-2px)}button:focus-visible{outline:2px solid #ffe4a0;outline-offset:5px}.signature{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#a68791;margin:32px 0 0}.corner{position:absolute;top:48px;color:#d3a26366;font-size:35px}.corner.left{left:48px}.corner.right{right:48px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    @keyframes flicker{from{transform:rotate(-14deg) scale(.95)}to{transform:rotate(-5deg) scale(1.05)}}@media(max-width:540px){main{padding:76px 32px 35px}.lamps{gap:22px;height:140px}.diya{width:70px;height:34px}.diya:nth-child(2){width:95px;height:44px}.wish{max-width:285px}.eyebrow{font-size:9px;letter-spacing:.26em}.corner{top:45px;font-size:24px}.corner.left{left:40px}.corner.right{right:40px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
    .brand{display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #f5d59b;border-radius:10px;padding:16px 22px;margin:0 0 28px;box-shadow:0 8px 35px #0003}.brand img{display:block;width:220px;max-width:100%;height:auto}.sender{font-family:Arial,sans-serif;color:#f5d59b;font-size:12px;letter-spacing:.2em;margin:22px 0 0;line-height:1.7}.sender strong{display:block;font-size:15px;letter-spacing:.17em;margin-top:4px}@media(max-width:540px){.brand{padding:13px 18px;margin-bottom:24px}.brand img{width:190px}.sender strong{font-size:13px}}
    /* An unboxed gold treatment keeps the original Westports artwork. */
    .brand{position:relative;background:none;border:0;border-radius:0;box-shadow:none;padding:0 24px 18px;margin-bottom:24px}
    .brand:after{content:'';position:absolute;bottom:0;left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent,#d5aa65,transparent)}
    .brand img{width:210px;filter:brightness(0) saturate(100%) invert(86%) sepia(30%) saturate(642%) hue-rotate(341deg) brightness(99%) contrast(94%);opacity:.95}
    @media(max-width:540px){
      main{padding:38px 26px 28px;min-height:100svh;justify-content:center}
      main:before{inset:10px;border-radius:100px 100px 12px 12px}main:after{inset:17px;border-radius:94px 94px 8px 8px}
      .brand{padding:0 20px 15px;margin-bottom:18px}.brand img{width:180px}
      .eyebrow{font-size:8px;letter-spacing:.23em;margin-bottom:15px}
      .ornament{font-size:20px;margin-bottom:12px}
      h1{font-size:clamp(55px,16vw,83px)}h1 span{padding-bottom:10px}
      .rule{margin-top:14px;width:40px}.wish{font-size:14px;line-height:1.7;margin-top:15px;max-width:290px}
      .lamps{height:112px;gap:20px;margin-top:6px;flex-shrink:0}
      .diya{width:62px;height:30px}.diya:nth-child(2){width:85px;height:39px;margin-bottom:8px}
      .diya:before{height:37px;top:-40px;width:20px;left:calc(50% - 10px)}
      .diya:nth-child(2):before{height:48px;top:-51px;width:25px;left:calc(50% - 12px)}
      .diya:after{font-size:9px;letter-spacing:1px;inset:6px 0}
      button{margin-top:23px;min-height:44px;padding:11px 20px}
      .sender{margin-top:19px;font-size:10px}.sender strong{font-size:13px;margin-top:2px}
      .signature{font-size:8px;letter-spacing:.14em;margin-top:18px;line-height:1.6}
      .corner{top:29px;font-size:18px}.corner.left{left:28px}.corner.right{right:28px}
    }
    @media(max-width:540px) and (max-height:700px){
      main{padding-top:30px;padding-bottom:24px}.brand{margin-bottom:12px;padding-bottom:11px}.brand img{width:158px}
      .eyebrow{margin-bottom:10px}.ornament{margin-bottom:8px;font-size:17px}
      h1{font-size:clamp(52px,15vw,72px)}.wish{font-size:13px;margin-top:11px}.rule{margin-top:10px}
      .lamps{height:96px}button{margin-top:17px}.sender{margin-top:13px}.signature{margin-top:12px}
    }

/* Royal blue, cyan, white and gold: inspired by our IT kolam. */
html{background:#06115b}body{background:radial-gradient(ellipse at 50% 35%,#123bc0 0%,#081b7b 46%,#030b38 100%);color:#fff}
main{max-width:620px;margin:auto;padding:42px 32px 32px;overflow:hidden}
main:before{inset:12px;border:2px solid #ffd02f;border-radius:180px 180px 22px 22px;box-shadow:inset 0 0 28px #05cfff12,0 0 22px #ffc40012}
main:after{inset:20px;border:1px solid #eafaff99;border-radius:172px 172px 16px 16px}
.brand{padding-bottom:14px;margin-bottom:18px}.brand:after{background:linear-gradient(90deg,transparent,#ffe361,transparent)}.brand img{width:190px;filter:brightness(0) invert(1);opacity:1}
.eyebrow{color:#9aefff;font-size:9px;letter-spacing:.25em;margin-bottom:14px}
.kolam{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 0 20px #00d5ff44);margin:0 0 14px}
h1{font-size:clamp(66px,9vw,104px);text-shadow:0 3px 18px #0005}h1 span{background:linear-gradient(110deg,#ffbd05,#fff6a9 45%,#ffcc00);background-clip:text;-webkit-background-clip:text;padding-bottom:9px}
.family{position:relative;margin:14px 0 0;padding:10px 32px 12px;border-top:1px solid #ffd32c99;border-bottom:1px solid #ffd32c99;font-size:24px;font-style:italic;line-height:1.15;color:white}.family span{display:block;color:#ffdb28;font-size:32px;font-weight:bold;margin-top:3px}
.wish{color:#e0f4ff;font-size:16px;line-height:1.65;margin-top:17px}
.lamps{height:115px;margin-top:0;gap:30px}.diya{background:linear-gradient(#117ee9,#1029a4 70%,#08145e);border-top-color:#ffe75d;box-shadow:0 10px 30px #0004,inset 0 -6px 0 #00caff22}.diya:after{color:#ffdd45}
button{border-color:#ffe165aa;color:#ffe97d;background:#06135e99;margin-top:24px}button:hover{background:#1743b4}.sender{color:#a9efff;margin-top:18px}.sender strong{color:#ffe362}.signature{color:#b8d8ff;margin-top:18px}.corner{color:#ffe650}
@media(min-width:700px){body:before,body:after{content:'';position:fixed;top:50%;width:min(52vw,760px);aspect-ratio:1;background:url('assets/kolam.svg') center/contain no-repeat;opacity:.12;pointer-events:none;transform:translateY(-50%)}body:before{left:-26vw}body:after{right:-26vw}}
@media(max-width:540px){main{padding:32px 25px 26px}.brand{margin-bottom:13px;padding-bottom:11px}.brand img{width:168px}.eyebrow{font-size:7px;letter-spacing:.19em;margin-bottom:11px}.kolam{width:110px;height:110px;margin-bottom:11px}h1{font-size:clamp(54px,16vw,80px)}.family{font-size:20px;padding:8px 24px 10px;margin-top:9px}.family span{font-size:27px}.wish{font-size:13px;margin-top:13px}.lamps{height:92px;gap:20px}button{margin-top:19px}.sender{margin-top:14px}.signature{margin-top:13px;font-size:7px}.corner{top:31px}}
@media(max-width:540px) and (max-height:740px){main{padding:28px 24px 24px}.brand img{width:148px}.brand{margin-bottom:10px}.kolam{width:80px;height:80px;margin-bottom:9px}.eyebrow{margin-bottom:8px}h1{font-size:clamp(48px,14vw,67px)}.family{font-size:18px;margin-top:6px}.family span{font-size:24px}.wish{font-size:12px;margin-top:10px}.lamps{height:83px}button{margin-top:15px}.sender{margin-top:10px}.signature{margin-top:10px}}

    @keyframes kolam-turn{to{transform:rotate(360deg)}}
    @keyframes gold-shimmer{to{background-position:200% center}}
    @keyframes light-breathe{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.12)}}
    @keyframes greeting-arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:no-preference){
      .kolam{animation:kolam-turn 32s linear infinite}
      h1{animation:greeting-arrive 1.1s ease-out both}
      h1 span{background-size:200% auto;animation:gold-shimmer 2.4s linear infinite}
      .corner{animation:light-breathe 1.5s ease-in-out infinite}.corner.right{animation-delay:-2s}
      .brand,.family,.wish,.sender{animation:greeting-arrive 1.3s ease-out both}
      .family{animation-delay:.15s}.wish{animation-delay:.3s}.sender{animation-delay:.45s}
      .diya{animation:lamp-glow 1.2s ease-in-out infinite alternate}.diya:nth-child(2){animation-delay:-1s}
      @keyframes lamp-glow{to{box-shadow:0 0 25px #ffcd2933,0 10px 30px #0004,inset 0 -6px 0 #00caff33}}
    }
    body.motion-paused *,body.motion-paused *:before,body.motion-paused:before,body.motion-paused:after{animation-play-state:paused!important}
  </style>
</head>
<body>
  <canvas id="sparkles" aria-hidden="true"></canvas>
  <main>
    <span class="corner left" aria-hidden="true">✧</span><span class="corner right" aria-hidden="true">✧</span>
    <div class="brand"><img src="assets/westports-logo.png" alt="Westports" width="250" height="42"></div>
    <p class="eyebrow">A celebration of light & togetherness</p>
    <img class="kolam" src="assets/kolam.svg" alt="" aria-hidden="true" width="600" height="600">
    <h1>Happy<span>Deepavali</span></h1>
    <p class="family">Thousand Lights,<span>One Family</span></p>
    <p class="wish">May the light we share bring us closer,<br>fill our hearts with joy,<br>and brighten every new beginning.</p>
    <div class="lamps" aria-hidden="true"><div class="diya"></div><div class="diya"></div><div class="diya"></div></div>
    <button id="celebrate" type="button">✦ &nbsp; Send a little light</button>
    <p class="sender">From<strong>IT DEPARTMENT</strong></p>
    <p class="signature">Wishing you & your loved ones happiness</p>
    <p id="announcement" class="sr-only" role="status"></p>
  </main>
  <script>
    const canvas = document.querySelector('#sparkles');
    const ctx = canvas.getContext('2d');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    let width, height, stars = [], particles = [], frame, previousTime = 0, nextBurst = 0;
    function resize() {
      width = innerWidth; height = innerHeight;
      const ratio = Math.min(devicePixelRatio || 1, 2);
      canvas.width = width * ratio; canvas.height = height * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      stars = Array.from({length: 65}, () => ({x: Math.random()*width, y: Math.random()*height, r: Math.random()*1.3+.3, phase: Math.random()*6.28}));
      if (reduced.matches) draw(0);
    }
    function burst(x,y) {
      if (reduced.matches) return;
      if (particles.length > 280) return;
      for(let i=0;i<45;i++) {
        const angle = Math.random()*Math.PI*2, speed = Math.random()*3.8+1.2;
        particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color:['#ffdb28','#33d9ff','#ffffff'][i%3]});
      }
    }
    function draw(time, step = 0) {
      ctx.clearRect(0,0,width,height);
      for(const star of stars) {
        ctx.globalAlpha = .25 + (Math.sin(time*.0025+star.phase)+1)*.23;
        if (!reduced.matches) {star.y -= step * (.45 + star.r * .35); if(star.y < -3) star.y = height + 3;}
        ctx.fillStyle = '#f6cd85'; ctx.beginPath(); ctx.arc(star.x + Math.sin(time*.001 + star.phase)*5,star.y,star.r,0,Math.PI*2); ctx.fill();
      }
      for(const p of particles) {
        p.x+=p.vx*step; p.y+=p.vy*step; p.vy+=.025*step; p.life-=.012*step;
        ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fill();
      }
      particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;
    }
    function animate(time) {
      const step = previousTime ? Math.min((time-previousTime)/16.667, 2) : 1;
      previousTime = time;
      if(time > nextBurst){burst(width*(Math.random()<.5 ? .12 : .88),height*(.12+Math.random()*.26));nextBurst=time+1500+Math.random()*1000;}
      draw(time,step);frame=requestAnimationFrame(animate);
    }
    function start() {cancelAnimationFrame(frame);particles=[];previousTime=0;nextBurst=performance.now()+1800;if(document.hidden)return;if(reduced.matches) draw(0);else {burst(width*.2,height*.25);burst(width*.8,height*.3);frame=requestAnimationFrame(animate)}}
    document.querySelector('#celebrate').addEventListener('click',()=>{
      burst(width*.18,height*.28);burst(width*.82,height*.25);burst(width*.5,height*.16);
      document.querySelector('#announcement').textContent='Sending you light, love and a very Happy Deepavali!';
      document.querySelector('#celebrate').textContent='✦  Wishing you light & love';
    });
    addEventListener('resize',resize);reduced.addEventListener('change',start);
    document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('motion-paused',document.hidden);if(document.hidden)cancelAnimationFrame(frame);else start()});
    resize();start();
  </script>
</body>
</html>
